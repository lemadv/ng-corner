<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ng-corner - Angular Insights, Tutorials & Community</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Your go-to source for Angular insights, tutorials, and community-driven content. Stay updated with the latest Angular best practices and techniques." />
    <meta name="keywords" content="Angular, TypeScript, JavaScript, Web Development, Programming, Tutorials, NgRx, RxJS" />
    <meta name="author" content="ng-corner" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="ng-corner - Angular Insights & Tutorials" />
    <meta property="og:description" content="Your go-to source for Angular insights, tutorials, and community-driven content." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ng-corner.dev" />
    <meta property="og:site_name" content="ng-corner" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ng-corner - Angular Insights & Tutorials" />
    <meta name="twitter:description" content="Your go-to source for Angular insights, tutorials, and community-driven content." />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="msapplication-TileColor" content="#4F46E5" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.ico" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ng-corner",
      "description": "Your go-to source for Angular insights, tutorials, and community-driven content",
      "url": "https://ng-corner.dev",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ng-corner.dev?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
