version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - blog-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      - NODE_ENV=development
      - PORT=3333
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge