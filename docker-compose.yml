services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4200:4200"
    volumes:
      - .:/app:cached
      - /app/node_modules
      - type: volume
        target: /app/dist
      - type: volume
        target: /app/.nx
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - blog-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3333:3333"
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - type: volume
        target: /app/node_modules
      - type: volume
        target: /app/dist
      - type: volume
        target: /app/.nx
    environment:
      - NODE_ENV=development
      - PORT=3333
      - CHOKIDAR_USEPOLLING=true
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
