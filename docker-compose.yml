services:
  postgres:
    image: postgres:16-alpine
    container_name: ng-corner-postgres
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
      POSTGRES_DB: blog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: node:22-alpine
    container_name: ng-corner-backend
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://blog_user:blog_password@postgres:5432/blog_db
      - JWT_SECRET=dev-jwt-secret-key
      - JWT_EXPIRES_IN=1h
      - REFRESH_TOKEN_SECRET=dev-refresh-token-secret-key
      - REFRESH_TOKEN_EXPIRES_IN=7d
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - npm_cache:/root/.npm
    command: sh -c "apk add --no-cache netcat-openbsd && npm ci && echo 'Waiting for postgres...' && while ! nc -z postgres 5432; do sleep 1; done && echo 'PostgreSQL is ready!' && npx prisma generate --schema=./apps/blog-be/prisma/schema.prisma && npx prisma migrate dev --schema=./apps/blog-be/prisma/schema.prisma --name init && DATABASE_URL='postgresql://blog_user:blog_password@postgres:5432/blog_db' npx nx serve blog-be --host 0.0.0.0 --watch"

  frontend:
    image: node:22-alpine
    container_name: ng-corner-frontend
    working_dir: /app
    environment:
      - NODE_ENV=development
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - npm_cache:/root/.npm
    command: sh -c "npm ci && npx nx serve blog --configuration=development --host 0.0.0.0 --poll=2000"

volumes:
  postgres_data:
  npm_cache:

networks:
  default:
    name: ng-corner-network